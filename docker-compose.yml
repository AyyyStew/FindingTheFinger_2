services:
  postgres:
    build:
      context: .
      dockerfile: deploy/postgres/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_RESTORE_URL: ${DB_RESTORE_URL:-}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: deploy/backend/Dockerfile
      args:
        INSTALL_EMBEDDINGS: ${BACKEND_INSTALL_EMBEDDINGS:-true}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      PRELOAD_EMBED_MODEL: ${PRELOAD_EMBED_MODEL:-false}
      ENABLE_SEMANTIC_SEARCH: ${ENABLE_SEMANTIC_SEARCH:-true}
      RUN_DB_MIGRATIONS: ${RUN_DB_MIGRATIONS:-true}
      HF_HOME: ${HF_HOME:-/root/.cache/huggingface}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./static:/app/static:ro
      - model-cache:/root/.cache/huggingface

  web:
    build:
      context: .
      dockerfile: deploy/web/Dockerfile
      args:
        VITE_STATIC_BASE_URL: ${VITE_STATIC_BASE_URL:-/static}
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    depends_on:
      - backend
    ports:
      - "${APP_HTTP_PORT:-80}:80"
      - "${APP_HTTPS_PORT:-443}:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  model-cache:
  caddy-data:
  caddy-config:
